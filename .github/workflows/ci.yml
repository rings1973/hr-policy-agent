name: CI

on:
  push:
    branches: [ main, skapali ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Build keyless TF-IDF index
        run: python -m app.rag.ingest --embedder tfidf --out "$RUNNER_TEMP/index"

      - name: Run tests
        run: pytest -q
        env:
          EMBEDDING_BACKEND: tfidf
          INDEX_DIR: ${{ runner.temp }}/index
