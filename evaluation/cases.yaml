      reimbursable up to $75 per day including tax and tip, with receipts.
    gold_facts: ["manager approval, HR review and security review for international work",
                 "tax and immigration review only above 30 days", "meals up to $75 per day"]
    must_mention: ["HR", "security", "75"]
    gold_docs: [remote_work_policy, expense_policy]
    expected_tools: [search_policy_documents]
    optional_tools: [get_policy_section, check_policy_compliance]
    forbidden_tools: [create_mock_hr_ticket]
    expected_status: [ok]

