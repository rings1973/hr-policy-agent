      requires annual security training, a company-managed device and VPN.
    gold_facts: ["manager approval before working from another location",
                 "another state can create tax obligations", "annual security training",
                 "company-managed device and VPN"]
    must_mention: ["approval", "tax", "security"]
    gold_docs: [remote_work_policy, data_security_policy]
    expected_tools: [search_policy_documents]
    optional_tools: [get_policy_section, check_policy_compliance]
    forbidden_tools: [create_mock_hr_ticket]
    expected_status: [ok, clarify]

