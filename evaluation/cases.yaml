# Evaluation cases for the HR policy agent (28). Run with REFERENCE_DATE=2026-10-22 so the date
# rules (90-day wait, notice periods) give the same decisions on any day.
#
# Fields
#   id, category        category is one of: single_doc, multi_doc, workflow, ambiguous, adversarial
#   employee_id         who the user is acting as (the UI picker), or null
#   prompt              the user message
#   gold_answer         a reference answer, written by hand from the policies and mock data
#   gold_facts          atomic facts a correct answer states (scored by the judge)
#   must_mention        lexical fallback when no judge is available: each entry must appear in the
#                       answer; "a|b" accepts either alternative (case-insensitive)
#   gold_docs           doc_ids a complete answer cites (doc recall)
#   expected_tools      tools an ideal run calls (tool recall)
#   optional_tools      reasonable extra calls that do not count against tool precision
#   forbidden_tools     calls that are wrong for this case
#   expected_status     allowed final statuses

cases:
  # ---------------------------------------------------------------- single-document policy (8)
  - id: S01
    category: single_doc
    employee_id: null
    prompt: How many PTO days do full-time employees get per year?
    gold_answer: >-
      Full-time employees get 15 days of PTO a year in their first two years, 20 days after two
      full years of service, and 25 days after five full years.
    gold_facts: ["15 days in the first two years", "20 days after two full years",
                 "25 days after five full years"]
    must_mention: ["15", "20", "25"]
    gold_docs: [pto_policy]
    expected_tools: [search_policy_documents]
    optional_tools: [get_policy_section]
    forbidden_tools: [create_mock_hr_ticket, draft_hr_email]
    expected_status: [ok]

  - id: S02
    category: single_doc
    employee_id: null
    prompt: What is the reimbursement limit for a home office chair?
    gold_answer: >-
      A home office chair or desk is reimbursable up to $300 per item, once every 3 years, with
      manager approval and an itemized receipt.
    gold_facts: ["up to $300 per item", "once every 3 years", "manager approval",
                 "itemized receipt"]
    must_mention: ["300", "3 years|three years"]
    gold_docs: [expense_policy]
    expected_tools: [search_policy_documents]
    optional_tools: [get_policy_section]
    forbidden_tools: [create_mock_hr_ticket]
    expected_status: [ok]

  - id: S03
    category: single_doc
    employee_id: null
    prompt: Can I buy a laptop and expense it?
    gold_answer: >-
      No. Laptops and other computing devices are not reimbursable; they must be requested from
      IT and issued as company-managed equipment.
    gold_facts: ["laptops are not reimbursable", "request the laptop from IT",
                 "issued as company-managed equipment"]
    must_mention: ["not reimbursable|cannot|can't|no", "IT"]
    gold_docs: [expense_policy]
    expected_tools: [search_policy_documents]
    optional_tools: [get_policy_section]
    forbidden_tools: [create_mock_hr_ticket]
    expected_status: [ok]

