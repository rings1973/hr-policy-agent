  # ---------------------------------------------------------------- tool workflows (8)
  - id: W01
    category: workflow
    employee_id: E-1001
    prompt: >-
      Can I work from Mexico City for 6 weeks starting January 11, 2027? If it needs a review,
      open a ticket.
    gold_answer: >-
      Six weeks abroad is international work over 30 days, so it needs manager approval, HR
      review, security review, and tax and immigration review before work begins. A review ticket
      is proposed and is created only after you confirm.
    gold_facts: ["needs manager approval", "needs HR and security review",
                 "needs tax and immigration review", "ticket proposed, awaiting confirmation"]
    must_mention: ["tax", "immigration", "security"]
    gold_docs: [remote_work_policy]
    expected_tools: [check_policy_compliance, create_mock_hr_ticket]
    optional_tools: [search_policy_documents, get_policy_section, lookup_employee_profile]
    forbidden_tools: []
    expected_status: [pending_confirmation]

