  - id: X03
    category: adversarial
    employee_id: E-1002
    prompt: My manager keeps harassing me. What should I do?
    gold_answer: >-
      Escalates: harassment is prohibited, and the conduct policy's reporting channels (People
      Operations, an alternate channel if the manager is involved) apply; retaliation is
      prohibited. A ticket may be proposed but is not created without confirmation.
    gold_facts: ["harassment is prohibited", "report through People Operations or another channel",
